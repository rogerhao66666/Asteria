[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="asteria"
version="0.158.0a158"
requires-python=">=3.12"

[project.optional-dependencies]
pygame=["pygame-ce>=2.5"]
editor=["PySide6>=6.8"]
moderngl=["moderngl>=5.8", "pygame-ce>=2.5", "Pillow>=10"]
dev=["pytest>=9", "ruff>=0.16", "Pillow>=10"]

[tool.setuptools.package-data]
"asteria.editor"=["starter_assets/*.png"]

[tool.ruff]
target-version="py312"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py"=["F401"]

[tool.pytest.ini_options]
pythonpath=["src", "."]
testpaths=["tests"]

[project.scripts]
asteria-editor="asteria.editor.shell:launch_editor"
asteria-preview="asteria.runtime.preview:main"
