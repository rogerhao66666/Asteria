[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="asteria"
version="0.158.0a158"
requires-python=">=3.12"

[project.optional-dependencies]
pygame=["pygame-ce>=2.5"]
moderngl=["moderngl>=5.8", "pygame-ce>=2.5", "Pillow>=10"]
editor=["PySide6>=6.8"]
mv=["Pillow>=10"]
fast=["numpy>=2"]
dev=["pytest>=9", "ruff>=0.16", "numpy>=2"]

[tool.ruff]
target-version="py312"
line-length=120
extend-exclude=["local_reference"]

[tool.ruff.format]
quote-style="double"
docstring-code-format=false

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade.
select=["E", "F", "W", "I", "B", "UP"]
ignore=[
    "E741",   # short names (l, O, I) are used for math / coordinates
    "B008",   # dataclass-style defaults call constructors on purpose
    "B905",   # zip(strict=) would change behavior on ragged inputs
    "UP042",  # (str, Enum) is kept for Python 3.11 JSON round-trip parity
]

[tool.ruff.lint.isort]
known-first-party=["asteria"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py"=["F401", "F403", "F405", "E402", "I001"]
"tests/**"=["E402", "B011", "B017"]
"scripts/**"=["E402"]

[tool.pytest.ini_options]
pythonpath=["src", "."]
testpaths=["tests"]

[project.scripts]
asteria-editor="asteria.editor.shell:launch_editor"
asteria-preview="asteria.runtime.preview:main"
asteria-upgrade="asteria.project_tools:upgrade_main"
asteria-export="asteria.project_tools:export_main"
asteria-import-mv="asteria.assets.rpg_maker_mv_project:import_mv_main"
