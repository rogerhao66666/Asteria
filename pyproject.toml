[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="asteria"
version="0.73.0a73"
requires-python=">=3.12"

[project.optional-dependencies]
pygame=["pygame-ce>=2.5"]
editor=["PySide6>=6.8"]
dev=["pytest>=9", "ruff>=0.16"]

[tool.ruff]
target-version="py312"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py"=["F401"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]

[project.scripts]
asteria-editor="asteria.editor.shell:launch_editor"
asteria-preview="asteria.runtime.preview:main"
