name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: Install Asteria
        run: python -m pip install -e ".[pygame,moderngl,editor,mv,dev]"

      - name: Compile
        run: python -m compileall -q src tests scripts

      # Rule set, line length and formatter options live in pyproject.toml.
      - name: Lint
        run: ruff check src tests scripts

      - name: Format check
        run: ruff format --check src tests scripts

      # Tests marked mv_reference skip automatically: the RPG Maker MV
      # reference is git-ignored and only exists on developer machines.
      - name: Test
        run: python -m pytest -q
